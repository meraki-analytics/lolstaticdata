services:
  # Application service: Bun wrapper handles startup generation and scheduled checks internally.
  lol-data-generator:
    build: .
    container_name: lol-data-generator
    volumes:
      # Named volume to share generated files with other containers
      - lol-static-data:/app/srv
      # Cache is kept outside the exposed srv volume
      - ./__cache__:/app/__cache__
    environment:
      - REPO_ROOT=/app
    # Keep the service running; scheduler cadence is managed by WrapperService.
    restart: unless-stopped

volumes:
  # Named volume that can be accessed by other Docker containers
  # Other containers can mount this volume to access the generated JSON files
  lol-static-data:
    driver: local
